name: Worker Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: nixos-zylphia
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: worker
        run: nix shell nixpkgs#nodejs_22 -c npm ci

      - name: Patch workerd for NixOS
        run: |
          INTERP=$(nix eval --raw nixpkgs#glibc)/lib/ld-linux-x86-64.so.2
          nix shell nixpkgs#patchelf -c patchelf --set-interpreter "$INTERP" worker/node_modules/@cloudflare/workerd-linux-64/bin/workerd

      - name: Create test fixtures
        run: |
          mkdir -p static/_site
          printf 'COOKIE_SECRET=ci-test-cookie-secret\nHASH_PEPPER=ci-test-hash-pepper\nRESEND_API_KEY=re_test_dummy\n' > worker/.dev.vars

      - name: Run tests
        working-directory: worker
        run: nix shell nixpkgs#nodejs_22 -c npm test
